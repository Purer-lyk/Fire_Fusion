# Fixed 640 FP32; the 100-epoch fine-tuning budget is provisional, not convergence verified.
_BASE_:
  - C:/lyk/fire/qualityDetection/runtime/ppyolov2_windows_base.yml
  - C:/lyk/fire/qualityDetection/datasets/rgb/ppyolov2_dataset.yml
pretrain_weights: C:/lyk/fire/qualityDetection/runtime/ResNet50_vd_ssld_pretrained.pdparams
weights: C:/lyk/fire/qualityDetection/training/output/ppyolov2_rgb/model_final
save_dir: C:/lyk/fire/qualityDetection/training/output/ppyolov2_rgb
output_eval: C:/lyk/fire/qualityDetection/training/eval/rgb
num_classes: 1
norm_type: bn
worker_num: 0
use_gpu: true
amp: false
use_ema: true
epoch: 100
snapshot_epoch: 5
log_iter: 20
LearningRate:
  base_lr: 0.0008333333333333334
  schedulers:
    - !PiecewiseDecay
      gamma: 0.1
      milestones: [60, 85]
    - !LinearWarmup
      start_factor: 0.0
      steps: 500
TrainReader:
  batch_size: 2
  shuffle: true
  drop_last: true
  use_shared_memory: false
  mixup_epoch: 100
  sample_transforms:
    - Decode: {}
    - Mixup: {alpha: 1.5, beta: 1.5}
    - RandomDistort: {}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {target_size: [640, 640], random_size: False, random_interp: False, keep_ratio: False}
    - NormalizeBox: {}
    - PadBox: {num_max_boxes: 100}
    - BboxXYXY2XYWH: {}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
    - Gt2YoloTarget: {anchor_masks: [[6, 7, 8], [3, 4, 5], [0, 1, 2]], anchors: [[10, 13], [16, 30], [33, 23], [30, 61], [62, 45], [59, 119], [116, 90], [156, 198], [373, 326]], downsample_ratios: [32, 16, 8]}
EvalReader:
  batch_size: 2
  use_shared_memory: false
TrainDataset:
  dataset_dir: C:/lyk/fire/qualityDetection/datasets/rgb
EvalDataset:
  data_fields: [image]
  dataset_dir: C:/lyk/fire/qualityDetection/datasets/rgb
  allow_empty: true
  empty_ratio: 1.0
TestReader:
  batch_size: 1
  use_shared_memory: false
